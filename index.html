<!DOCTYPE html>
<html>
	<head>
		<title>Minecraft Character Banners</title>
		<style>
			.color-select {
				border: none;
				overflow: hidden;
			}
			.color-select option {
				display: inline-block;
				cursor: pointer;
				padding: 0.5em;
				border: 1px solid #000000;
				width: 2em;
				height: 2em;
			}
			.cursor-select option:checked {
				border: 5px solid #000000;
			}
		</style>
	</head>
	<body>
		<h2>Minecraft Character Banners</h2>
		Foreground: <select id='fg-select'></select><br/>
		Background: <select id='bg-select'></select><br/><br/>
		Click to copy: <span id='get-one'></span><br/>
		<br/>
		Alternatively, copy entire sets: <button id='get-uppercase'>Uppercase</button> <button id='get-lowercase'>Lowercase</button> <button id='get-symbols-1'>Symbols (1/2)</button> <button id='get-symbols-2'>Symbols (2/2)</button><br/>
		<br/>
		<img src='screenshot.png' width='1000px'/><br/>
		<br/><br/><br/>
		Use <code>/cgive</code>? <input id='cc-toggle' type='checkbox'></input>

				'/': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_downleft"},{color:"${bg}",pattern:"minecraft:border"}`],
				'%': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:square_bottom_right"},{color:"${fg}",pattern:"minecraft:square_top_left"},{color:"${fg}",pattern:"minecraft:stripe_downleft"},{color:"${bg}",pattern:"minecraft:border"}`],
				'&': (fg, bg) => [`minecraft:${fg}_banner`, `{color:"${bg}",pattern:"minecraft:stripe_center"},{color:"${fg}",pattern:"minecraft:triangles_top"},{color:"${bg}",pattern:"minecraft:curly_border"},{color:"${bg}",pattern:"minecraft:square_bottom_left"},{color:"${fg}",pattern:"minecraft:mojang"},{color:"${bg}",pattern:"minecraft:border"}`],
				'|': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_center"},{color:"${bg}",pattern:"minecraft:border"}`],
				'^': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_top"},{color:"${bg}",pattern:"minecraft:curly_border"},{color:"${bg}",pattern:"minecraft:rhombus"},{color:"${bg}",pattern:"minecraft:border"}`],
				'~': (fg, bg) => [`minecraft:${fg}_banner`, `{color:"${bg}",pattern:"minecraft:stripe_downleft"},{color:"${fg}",pattern:"minecraft:stripe_downright"},{color:"${bg}",pattern:"minecraft:stripe_bottom"},{color:"${bg}",pattern:"minecraft:stripe_top"},{color:"${bg}",pattern:"minecraft:curly_border"},{color:"${bg}",pattern:"minecraft:border"}`],
				'=': (fg, bg) => [`minecraft:${fg}_banner`, `{color:"${bg}",pattern:"minecraft:stripe_bottom"},{color:"${bg}",pattern:"minecraft:stripe_top"},{color:"${bg}",pattern:"minecraft:stripe_middle"},{color:"${bg}",pattern:"minecraft:border"}`],
				'<': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_downright"},{color:"${fg}",pattern:"minecraft:stripe_downleft"},{color:"${bg}",pattern:"minecraft:diagonal_left"},{color:"${bg}",pattern:"minecraft:diagonal_up_left"},{color:"${bg}",pattern:"minecraft:border"}`],
				'>': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_downright"},{color:"${fg}",pattern:"minecraft:stripe_downleft"},{color:"${bg}",pattern:"minecraft:diagonal_up_right"},{color:"${bg}",pattern:"minecraft:diagonal_right"},{color:"${bg}",pattern:"minecraft:border"}`],
				'(': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_downright"},{color:"${fg}",pattern:"minecraft:stripe_downleft"},{color:"${bg}",pattern:"minecraft:half_vertical"},{color:"${bg}",pattern:"minecraft:border"}`],
				')': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_downright"},{color:"${fg}",pattern:"minecraft:stripe_downleft"},{color:"${bg}",pattern:"minecraft:half_vertical_right"},{color:"${bg}",pattern:"minecraft:border"}`],
				'[': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:square_bottom_right"},{color:"${fg}",pattern:"minecraft:square_top_right"},{color:"${fg}",pattern:"minecraft:stripe_center"},{color:"${bg}",pattern:"minecraft:border"}`],
				']': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:square_bottom_left"},{color:"${fg}",pattern:"minecraft:square_top_left"},{color:"${fg}",pattern:"minecraft:stripe_center"},{color:"${bg}",pattern:"minecraft:border"}`],
				'{': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_bottom"},{color:"${fg}",pattern:"minecraft:stripe_top"},{color:"${fg}",pattern:"minecraft:stripe_left"},{color:"${bg}",pattern:"minecraft:curly_border"},{color:"${bg}",pattern:"minecraft:stripe_right"},{color:"${bg}",pattern:"minecraft:border"}`],
				'}': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_bottom"},{color:"${fg}",pattern:"minecraft:stripe_top"},{color:"${fg}",pattern:"minecraft:stripe_right"},{color:"${bg}",pattern:"minecraft:curly_border"},{color:"${bg}",pattern:"minecraft:stripe_left"},{color:"${bg}",pattern:"minecraft:border"}`],
				'_': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_bottom"},{color:"${bg}",pattern:"minecraft:border"}`],
				'@': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_right"},{color:"${bg}",pattern:"minecraft:half_horizontal_bottom"},{color:"${fg}",pattern:"minecraft:stripe_bottom"},{color:"${fg}",pattern:"minecraft:stripe_top"},{color:"${fg}",pattern:"minecraft:stripe_left"},{color:"${bg}",pattern:"minecraft:border"}`],
				'\\': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_downright"},{color:"${bg}",pattern:"minecraft:border"}`],
				'#': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:small_stripes"},{color:"${bg}",pattern:"minecraft:stripe_left"},{color:"${bg}",pattern:"minecraft:stripe_right"},{color:"${fg}",pattern:"minecraft:piglin"},{color:"${bg}",pattern:"minecraft:border"},{color:"${bg}",pattern:"minecraft:border"}`],
				'`': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_center"},{color:"${bg}",pattern:"minecraft:stripe_downright"},{color:"${bg}",pattern:"minecraft:circle"},{color:"${bg}",pattern:"minecraft:half_horizontal_bottom"},{color:"${bg}",pattern:"minecraft:border"}`],
				'$': (fg, bg) => [`minecraft:${bg}_banner`, `{color:"${fg}",pattern:"minecraft:stripe_bottom"},{color:"${fg}",pattern:"minecraft:stripe_top"},{color:"${fg}",pattern:"minecraft:stripe_downright"},{color:"${bg}",pattern:"minecraft:border"},{color:"${fg}",pattern:"minecraft:stripe_center"},{color:"${bg}",pattern:"minecraft:curly_border"}`]
			};

			const fg_select = document.querySelector('#fg-select');
			const bg_select = document.querySelector('#bg-select');
			for (const color of colors) {
				const fg_option = document.createElement('option');
				fg_option.textContent = color;
				fg_select.appendChild(fg_option);
				const bg_option = document.createElement('option');
				bg_option.textContent = color;
				bg_select.appendChild(bg_option);
			}
			fg_select.selectedIndex = localStorage.getItem('fg') ?? 3;
			fg_select.addEventListener('input', () => {
				localStorage.setItem('fg', `${fg_select.selectedIndex}`);
			});
			bg_select.selectedIndex = localStorage.getItem('bg') ?? 0;
			bg_select.addEventListener('input', () => {
				localStorage.setItem('bg', `${bg_select.selectedIndex}`);
			});

			const cc_toggle = document.querySelector('#cc-toggle');

			const make_shulker = (selector, name, chars) => document.querySelector(selector).addEventListener('click', () => {
				const fg = colors[fg_select.selectedIndex];
				const bg = colors[bg_select.selectedIndex];
				navigator.clipboard.writeText(`/${cc_toggle.checked ? 'cgive' : 'give @p'} minecraft:${bg}_shulker_box[item_name=${JSON.stringify(name)},container=[${chars.split('').map((c, i) => {
					const [banner, patterns] = banners[c](fg, bg);
					return `{slot:${i},item:{id:"${banner}",count:1,components:{"minecraft:item_name":${JSON.stringify(c)},"minecraft:banner_patterns":[${patterns}]}}}`;
				}).join(',')}]]`);
			});
			make_shulker('#get-uppercase', 'Uppercase', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ');
			make_shulker('#get-lowercase', 'Lowercase', 'abcdefghijklmnopqrstuvwxyz');
			make_shulker('#get-symbols-1', 'Symbols (1/2)', '1234567890?!,.:;\"\'+-*/%&|^~');
			make_shulker('#get-symbols-2', 'Symbols (2/2)', '=<>()[]{}_@\\#\`$');

			const get_one = document.querySelector('#get-one');
			for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz1234567890?!,.:;\"\'+-*/%&|^~=<>()[]{}_@\\#\`$') {
				const button = document.createElement('button');
				button.textContent = c;
				button.addEventListener('click', () => {
					const [banner, patterns] = banners[c](colors[fg_select.selectedIndex], colors[bg_select.selectedIndex]);
					navigator.clipboard.writeText(`/${cc_toggle.checked ? 'cgive' : 'give @s'} ${banner}[item_name=${JSON.stringify(c)},banner_patterns=[${patterns}]]`);
				});
				get_one.appendChild(button);
			}
		</script>
	</body>
</html>
