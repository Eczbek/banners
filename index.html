<!DOCTYPE html>
<html>
	<head>
		<title>Character Banners</title>
		<link rel="icon" href="data:,"/>
		<style>
			html {
				display: flex;
				justify-content: safe center;
			}
			body {
				position: relative;
				min-width: max-content;
			}
			code {
				background-color: #000000;
				color: #FFFFFF;
				padding-left: 0.25em;
				padding-right: 0.25em;
			}
			.right {
				position: absolute;
				right: 0;
			}
		</style>
	</head>
	<body>
		<h2>Character Banners</h2>
		Foreground: <select id="fg-select"></select><br/>
		Background: <select id="bg-select"></select><br/><br/>
		Click to copy <code>/give</code> commands: <span class="right">Use <code>/cgive</code>? <input id="cc-toggle" type="checkbox"></input></span><br/>
		<span id="copy-upper"></span><br/>
		<span id="copy-lower"></span><br/>
		<span id="copy-digit"></span><br/>
		<span id="copy-other"></span><br/><br/><br/>
		<span id="steps"></span>
		<script type="module">
			const colors = [
				["white","#FFFFFF"],
				["light_gray","#999999"],
				["gray","#4C4C4C"],
				["black","#191919"],
				["brown","#664C33"],
				["red","#993333"],
				["orange","#D87F33"],
				["yellow","#E5E533"],
				["lime","#7FCC19"],
				["green","#667F33"],
				["cyan","#4C7F99"],
				["light_blue","#6699D8"],
				["blue","#334CB2"],
				["purple","#7F3FB2"],
				["magenta","#B24CD8"],
				["pink","#F27FA5"]
			];
			const banners = {
				'A':[0,[[1,"stripe_top"],[0,"rhombus"],[1,"stripe_left"],[1,"stripe_right"],[1,"stripe_middle"],[0,"border"]]],
				'B':[1,[[0,"rhombus"],[1,"stripe_right"],[1,"stripe_middle"],[0,"curly_border"],[1,"stripe_left"],[0,"border"]]],
				'C':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[0,"rhombus"],[1,"stripe_left"],[0,"curly_border"],[0,"border"]]],
				'D':[1,[[0,"rhombus"],[1,"stripe_right"],[0,"curly_border"],[1,"stripe_left"],[0,"border"]]],
				'E':[0,[[1,"stripe_left"],[1,"stripe_middle"],[0,"stripe_right"],[1,"stripe_bottom"],[1,"stripe_top"],[0,"border"]]],
				'F':[0,[[1,"stripe_left"],[1,"stripe_middle"],[0,"stripe_right"],[1,"stripe_top"],[0,"border"]]],
				'G':[0,[[1,"stripe_right"],[0,"half_horizontal"],[1,"stripe_bottom"],[1,"stripe_top"],[1,"stripe_left"],[0,"border"]]],
				'H':[1,[[0,"stripe_center"],[1,"stripe_middle"],[0,"border"]]],
				'I':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[1,"stripe_center"],[0,"border"]]],
				'J':[1,[[0,"rhombus"],[1,"stripe_left"],[0,"half_horizontal"],[1,"stripe_right"],[0,"border"]]],
				'K':[0,[[1,"stripe_downright"],[0,"half_horizontal"],[1,"stripe_left"],[1,"stripe_downleft"],[0,"border"]]],
				'L':[0,[[1,"stripe_bottom"],[1,"stripe_left"],[0,"border"]]],
				'M':[0,[[1,"triangle_top"],[0,"triangles_top"],[1,"stripe_left"],[1,"stripe_right"],[0,"border"]]],
				'N':[1,[[0,"stripe_center"],[1,"stripe_downright"],[0,"border"]]],
				'O':[1,[[0,"rhombus"],[1,"stripe_left"],[1,"stripe_right"],[0,"curly_border"],[0,"border"]]],
				'P':[1,[[0,"rhombus"],[1,"stripe_right"],[0,"half_horizontal_bottom"],[1,"stripe_left"],[1,"stripe_middle"],[0,"border"]]],
				'Q':[1,[[0,"rhombus"],[1,"stripe_left"],[1,"stripe_right"],[0,"curly_border"],[1,"square_bottom_right"],[0,"border"]]],
				'R':[0,[[1,"stripe_downright"],[0,"half_horizontal"],[1,"creeper"],[1,"stripe_top"],[1,"stripe_left"],[0,"border"]]],
				'S':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[0,"rhombus"],[1,"stripe_downright"],[0,"curly_border"],[0,"border"]]],
				'T':[0,[[1,"stripe_top"],[1,"stripe_center"],[0,"border"]]],
				'U':[0,[[1,"stripe_bottom"],[0,"rhombus"],[1,"stripe_left"],[1,"stripe_right"],[0,"border"]]],
				'V':[0,[[1,"stripe_left"],[0,"triangle_bottom"],[1,"stripe_downleft"],[0,"border"]]],
				'W':[0,[[1,"triangle_bottom"],[0,"triangles_bottom"],[1,"stripe_left"],[1,"stripe_right"],[0,"border"]]],
				'X':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[0,"stripe_center"],[1,"stripe_downright"],[1,"stripe_downleft"],[0,"border"]]],
				'Y':[0,[[1,"stripe_downright"],[0,"half_horizontal_bottom"],[1,"stripe_downleft"],[0,"border"]]],
				'Z':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[1,"stripe_downleft"],[0,"border"]]],
				'a':[1,[[0,"diagonal_left"],[0,"rhombus"],[1,"cross"],[0,"half_horizontal"],[0,"border"]]],
				'b':[1,[[0,"rhombus"],[1,"stripe_right"],[0,"half_horizontal"],[1,"stripe_left"],[1,"stripe_middle"],[0,"border"]]],
				'c':[0,[[1,"stripe_left"],[0,"half_horizontal"],[1,"stripe_bottom"],[1,"stripe_middle"],[0,"border"]]],
				'd':[1,[[0,"rhombus"],[1,"stripe_left"],[0,"half_horizontal"],[1,"stripe_right"],[1,"stripe_middle"],[0,"border"]]],
				'e':[1,[[0,"stripe_bottom"],[1,"mojang"],[1,"stripe_left"],[1,"triangles_bottom"],[0,"half_horizontal"],[0,"border"]]],
				'f':[0,[[1,"square_top_right"],[1,"stripe_center"],[1,"straight_cross"],[0,"border"]]],
				'g':[0,[[1,"curly_border"],[1,"mojang"],[1,"stripe_right"],[1,"triangles_bottom"],[0,"stripe_top"],[0,"border"]]],
				'h':[0,[[1,"stripe_right"],[0,"half_horizontal"],[1,"stripe_left"],[1,"stripe_middle"],[0,"border"]]],
				'i':[0,[[1,"stripe_center"],[0,"stripe_top"],[0,"stripe_middle"],[0,"border"]]],
				'j':[1,[[0,"stripe_top"],[0,"straight_cross"],[0,"half_vertical"],[1,"stripe_bottom"],[0,"border"]]],
				'k':[0,[[1,"stripe_downright"],[0,"half_horizontal"],[1,"stripe_downleft"],[0,"stripe_top"],[1,"stripe_left"],[0,"border"]]],
				'l':[0,[[1,"square_bottom_right"],[1,"square_top_left"],[1,"stripe_center"],[0,"border"]]],
				'm':[0,[[1,"stripe_left"],[1,"stripe_right"],[1,"straight_cross"],[0,"half_horizontal"],[1,"stripe_middle"],[0,"border"]]],
				'n':[1,[[0,"stripe_center"],[0,"half_horizontal"],[1,"stripe_middle"],[0,"border"]]],
				'o':[1,[[0,"stripe_center"],[1,"small_stripes"],[1,"triangles_bottom"],[0,"half_horizontal"],[1,"stripe_middle"],[0,"border"]]],
				'p':[0,[[1,"stripe_right"],[0,"stripe_bottom"],[1,"mojang"],[1,"stripe_left"],[0,"stripe_top"],[0,"border"]]],
				'q':[0,[[1,"mojang"],[1,"stripe_right"],[0,"stripe_top"],[0,"border"]]],
				'r':[0,[[1,"stripe_left"],[0,"half_horizontal"],[1,"stripe_middle"],[0,"border"]]],
				's':[0,[[1,"mojang"],[1,"square_bottom_right"],[1,"triangles_bottom"],[0,"half_horizontal"],[1,"stripe_middle"],[0,"border"]]],
				't':[1,[[0,"stripe_top"],[0,"half_horizontal_bottom"],[1,"square_bottom_right"],[1,"stripe_center"],[0,"border"]]],
				'u':[1,[[0,"rhombus"],[1,"stripe_left"],[1,"stripe_right"],[0,"half_horizontal"],[0,"border"]]],
				'v':[1,[[0,"curly_border"],[0,"stripe_downleft"],[1,"stripe_left"],[0,"half_horizontal"],[0,"border"]]],
				'w':[0,[[1,"triangle_bottom"],[0,"triangles_bottom"],[1,"stripe_left"],[1,"stripe_right"],[0,"half_horizontal"],[0,"border"]]],
				'x':[0,[[1,"triangle_bottom"],[1,"rhombus"],[0,"triangle_top"],[0,"triangles_bottom"],[0,"border"]]],
				'y':[0,[[1,"stripe_bottom"],[1,"stripe_right"],[1,"stripe_downright"],[0,"stripe_top"],[0,"border"]]],
				'z':[0,[[1,"square_bottom_left"],[1,"triangles_bottom"],[1,"rhombus"],[0,"diagonal_left"],[1,"stripe_middle"],[0,"border"]]],
				'0':[1,[[0,"rhombus"],[1,"stripe_left"],[1,"stripe_right"],[1,"stripe_downleft"],[0,"curly_border"],[0,"border"]]],
				'1':[0,[[1,"square_top_left"],[0,"curly_border"],[1,"stripe_bottom"],[1,"stripe_center"],[0,"border"]]],
				'2':[0,[[1,"stripe_top"],[0,"rhombus"],[1,"stripe_downleft"],[0,"curly_border"],[1,"stripe_bottom"],[0,"border"]]],
				'3':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[1,"stripe_middle"],[0,"curly_border"],[1,"stripe_right"],[0,"border"]]],
				'4':[0,[[1,"stripe_left"],[0,"half_horizontal_bottom"],[1,"stripe_right"],[1,"stripe_middle"],[0,"border"]]],
				'5':[0,[[1,"stripe_bottom"],[0,"rhombus"],[1,"stripe_downright"],[0,"curly_border"],[1,"stripe_top"],[0,"border"]]],
				'6':[1,[[0,"circle"],[0,"half_horizontal"],[1,"stripe_top"],[1,"stripe_left"],[1,"stripe_middle"],[0,"border"]]],
				'7':[0,[[1,"square_bottom_left"],[1,"stripe_top"],[1,"stripe_downleft"],[0,"border"]]],
				'8':[1,[[0,"rhombus"],[1,"stripe_left"],[1,"stripe_right"],[1,"stripe_middle"],[0,"curly_border"],[0,"border"]]],
				'9':[1,[[0,"rhombus"],[1,"stripe_left"],[0,"half_horizontal_bottom"],[1,"stripe_right"],[1,"stripe_middle"],[0,"border"]]],
				'?':[0,[[1,"stripe_right"],[0,"half_horizontal_bottom"],[1,"square_bottom_left"],[1,"stripe_top"],[1,"stripe_middle"],[0,"border"]]],
				'!':[0,[[1,"stripe_center"],[0,"creeper"],[0,"creeper"],[0,"creeper"],[0,"border"]]],
				'.':[0,[[1,"stripe_bottom"],[0,"creeper"],[0,"stripe_left"],[0,"stripe_right"],[0,"border"]]],
				',':[0,[[1,"stripe_downleft"],[0,"half_horizontal"],[0,"stripe_middle"],[0,"border"]]],
				':':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[0,"stripe_left"],[0,"stripe_right"],[0,"border"]]],
				';':[0,[[1,"stripe_downleft"],[0,"half_horizontal"],[0,"stripe_middle"],[1,"square_top_left"],[0,"border"]]],
				'"':[0,[[1,"stripe_top"],[0,"stripe_center"],[0,"border"]]],
				'\'':[0,[[1,"stripe_center"],[0,"diagonal_up_right"],[0,"diagonal_up_left"],[0,"circle"],[0,"border"]]],
				'+':[0,[[1,"straight_cross"],[0,"stripe_bottom"],[0,"stripe_top"],[0,"border"]]],
				'-':[0,[[1,"stripe_middle"],[0,"border"]]],
				'*':[0,[[1,"stripe_middle"],[1,"cross"],[0,"stripe_bottom"],[0,"stripe_top"],[0,"border"]]],
				'/':[0,[[1,"stripe_downleft"],[0,"border"]]],
				'%':[0,[[1,"square_bottom_right"],[1,"square_top_left"],[1,"stripe_downleft"],[0,"border"]]],
				'&':[1,[[0,"stripe_center"],[1,"triangles_top"],[0,"curly_border"],[0,"square_bottom_left"],[1,"mojang"],[0,"border"]]],
				'|':[0,[[1,"stripe_center"],[0,"border"]]],
				'^':[0,[[1,"stripe_top"],[0,"curly_border"],[0,"rhombus"],[0,"border"]]],
				'~':[1,[[0,"stripe_downleft"],[1,"stripe_downright"],[0,"curly_border"],[0,"stripe_bottom"],[0,"stripe_top"],[0,"border"]]],
				'=':[1,[[0,"stripe_bottom"],[0,"stripe_top"],[0,"stripe_middle"],[0,"border"]]],
				'<':[0,[[1,"stripe_downright"],[1,"stripe_downleft"],[0,"diagonal_left"],[0,"diagonal_up_left"],[0,"border"]]],
				'>':[0,[[1,"stripe_downright"],[1,"stripe_downleft"],[0,"diagonal_up_right"],[0,"diagonal_right"],[0,"border"]]],
				'(':[0,[[1,"stripe_downright"],[1,"stripe_downleft"],[0,"half_vertical"],[0,"border"]]],
				')':[0,[[1,"stripe_downright"],[1,"stripe_downleft"],[0,"half_vertical_right"],[0,"border"]]],
				'[':[0,[[1,"square_bottom_right"],[1,"square_top_right"],[1,"stripe_center"],[0,"border"]]],
				']':[0,[[1,"square_bottom_left"],[1,"square_top_left"],[1,"stripe_center"],[0,"border"]]],
				'{':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[1,"stripe_left"],[0,"curly_border"],[0,"stripe_right"],[0,"border"]]],
				'}':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[1,"stripe_right"],[0,"curly_border"],[0,"stripe_left"],[0,"border"]]],
				'_':[0,[[1,"stripe_bottom"],[0,"border"]]],
				'@':[0,[[1,"stripe_right"],[0,"half_horizontal_bottom"],[1,"stripe_bottom"],[1,"stripe_top"],[1,"stripe_left"],[0,"border"]]],
				'\\':[0,[[1,"stripe_downright"],[0,"border"]]],
				'#':[0,[[1,"small_stripes"],[0,"stripe_left"],[0,"stripe_right"],[1,"piglin"],[0,"border"],[0,"border"]]],
				'`':[0,[[1,"stripe_center"],[0,"stripe_downright"],[0,"circle"],[0,"half_horizontal_bottom"],[0,"border"]]],
				'$':[0,[[1,"stripe_bottom"],[1,"stripe_top"],[1,"stripe_downright"],[0,"border"],[1,"stripe_center"],[0,"curly_border"]]]
			};

			const fg_select = document.querySelector('#fg-select');
			const bg_select = document.querySelector('#bg-select');
			const cc_toggle = document.querySelector('#cc-toggle');
			const steps = document.querySelector('#steps');
			const icon = document.querySelector('link[rel="icon"]');

			const pattern_images = Object.fromEntries(await Promise.all(['bricks', 'straight_cross', 'triangles_bottom', 'border', 'gradient', 'globe', 'stripe_right', 'stripe_downleft', 'triangles_top', 'stripe_bottom', 'diagonal_right', 'rhombus', 'diagonal_left', 'circle', 'flower', 'square_top_left', 'half_horizontal', 'diagonal_up_left', 'half_vertical', 'triangle_bottom', 'guster', 'half_horizontal_bottom', 'cross', 'square_bottom_left', 'diagonal_up_right', 'creeper', 'stripe_downright', 'gradient_up', 'square_top_right', 'triangle_top', 'small_stripes', 'curly_border', 'stripe_top', 'stripe_middle', 'mojang', 'skull', 'square_bottom_right', 'stripe_left', 'half_vertical_right', 'stripe_center', 'flow', 'piglin']
				.map((name) => new Promise((resolve) => {
					const img = new Image();
					img.addEventListener('load', () => resolve([name, img]));
					img.src = `assets/${name}.png`;
				}))
			));
	
			function redraw() {
				function make_banner_canvas() {
					const scale = 4;
					const canvas = document.createElement('canvas');
					canvas.style.border = '2px solid #7F7F7F';
					canvas.style.marginRight = '1em';
					canvas.width = 20 * scale;
					canvas.height = 40 * scale;
					const ctx = canvas.getContext('2d');
					ctx.imageSmoothingEnabled = false;
					return [canvas, ctx];
				}

				steps.innerHTML = '';
				for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789?!.,:;\"\'+-*/%&|^~=<>()[]{}_@\\#\`$') {
					const row = document.createElement('div');
					row.style.paddingBottom = '1em';
					steps.appendChild(row);
					const [result, result_ctx] = make_banner_canvas();
					result_ctx.fillStyle = colors[[bg_select, fg_select][banners[c][0]].selectedIndex][1];
					result_ctx.fillRect(0, 0, result.width, result.height);
					for (const [part, name] of banners[c][1]) {
						const [step, step_ctx] = make_banner_canvas();
						step_ctx.drawImage(result, 0, 0);
						row.appendChild(step);
						const [layer, layer_ctx] = make_banner_canvas();
						layer_ctx.drawImage(pattern_images[name], 1, 1, 20, 40, 0, 0, layer.width, layer.height);
						layer_ctx.globalCompositeOperation = "source-in";
						layer_ctx.fillStyle = colors[[bg_select, fg_select][part].selectedIndex][1];
						layer_ctx.fillRect(0, 0, layer.width, layer.height);
						result_ctx.drawImage(layer, 0, 0);
						
					}
					row.appendChild(result);
					if (c == '?') {
						const [icon_canvas, icon_ctx] = make_banner_canvas();
						icon_canvas.width = icon_canvas.height;
						icon_ctx.fillStyle = colors[bg_select.selectedIndex][1];
						icon_ctx.fillRect(0, 0, icon_canvas.width, icon_canvas.height);
						icon_ctx.drawImage(result, icon_canvas.width / 4, 0);
						icon.href = icon_canvas.toDataURL('image/png');
					}
				}
			}

			for (const [color] of colors) {
				const fg_option = document.createElement('option');
				fg_option.textContent = color;
				fg_select.appendChild(fg_option);
				const bg_option = document.createElement('option');
				bg_option.textContent = color;
				bg_select.appendChild(bg_option);
			}
			fg_select.selectedIndex = localStorage.getItem('fg') ?? 3;
			fg_select.addEventListener('input', () => {
				localStorage.setItem('fg', `${fg_select.selectedIndex}`);
				redraw();
			});
			bg_select.selectedIndex = localStorage.getItem('bg') ?? 0;
			bg_select.addEventListener('input', () => {
				localStorage.setItem('bg', `${bg_select.selectedIndex}`);
				redraw();
			});
			redraw();

			for (const [id, chars] of [
				['#copy-upper', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],
				['#copy-lower', 'abcdefghijklmnopqrstuvwxyz'],
				['#copy-digit', '0123456789'],
				['#copy-other', '?!.,:;\"\'+-*/%&|^~=<>()[]{}_@\\#\`$']
			]) {
				const span = document.querySelector(id);
				for (const c of chars) {
					const button = document.createElement('button');
					button.textContent = c;
					button.addEventListener('click', () => {
						const [banner, patterns] = banners[c];
						navigator.clipboard.writeText(`/${cc_toggle.checked ? 'cgive' : 'give @p'} ${colors[banner][0]}_banner[item_name=${JSON.stringify(c)},banner_patterns=[${patterns.map(([part, pattern]) => `{color:"${colors[[bg_select, fg_select][part].selectedIndex][0]}",pattern:"minecraft:${pattern}"}`).join(',')}]]`);
					});
					span.appendChild(button);
				}
			}
		</script>
	</body>
</html>
